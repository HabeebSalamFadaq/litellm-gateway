  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY_2
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-nemotron-3-super-120b-key-2

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY_3
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-nemotron-3-super-120b-key-3

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY_4
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-nemotron-3-super-120b-key-4

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY_1
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-north-mini-code-key-1

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY_2
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-north-mini-code-key-2

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY_1
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-minimax-m3-key-1

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY_2
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-minimax-m3-key-2

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY_1
      timeout: 120
    model_info:
      provider: openrouter
      id: openrouter-nemotron-3-ultra-key-1

  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
