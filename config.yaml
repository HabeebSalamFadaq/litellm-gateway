###############################################################################
# LiteLLM gateway for Claude Code
# ---------------------------------------------------------------------------
# Single public endpoint that Claude Code talks to. Internally it tries each
# provider in priority order, rotating through multiple API keys per provider
# before moving to the next provider.
#
# Every model below was verified to actually respond with content on the
# respective API key. Models that 404/429/500 on the supplied key have been
# removed - LiteLLM would just cool them down and serve nothing.
#
# Priority chain (top to bottom = first tried to last tried):
#
#   1. Gemini (Google AI Studio)   - 6 free-tier API keys cycled
#   2. OpenCode Zen                - 2 confirmed-working free models
#   3. OpenRouter                  - 4 keys, 4 confirmed-working free models
#   4. NVIDIA NIM                  - 1 key, 5 confirmed-working models
#   5. KiraAI (kiraai.vn)          - 1 key, all "free" tier paid in VND
#
# All credentials are read from environment variables. NEVER hardcode keys.
###############################################################################

model_list:
  ###########################################################################
  # Tier 1 - Google Gemini (PRIMARY, 6 free-tier keys cycled)
  # --------------------------------------------------------------------------
  # Verified working on the supplied free Google AI Studio keys:
  #   gemini-2.5-flash  - strong, fast, 1M context
  #   gemini-3.5-flash  - newer flash, 200K+ context, thinking support
  # The previously chosen gemini-2.5-pro is 404 on free keys ("no longer
  # available to new users"); gemini-3.1-pro-preview 429s the free tier.
  ###########################################################################
  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-1

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_2
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-2

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_3
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-3

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_4
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-4

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_5
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-5

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_6
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-2.5-flash-key-6

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY_1
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-3.5-flash-key-1

  - model_name: claude-coder
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY_2
      rpm: 60
      tpm: 1000000
      timeout: 120
      reasoning_effort: "none"
    model_info:
      provider: gemini
      id: gemini-3.5-flash-key-2

  ###########################################################################
  # Tier 2 - OpenCode Zen (verified working free models)
  # --------------------------------------------------------------------------
  # From the catalog, the only models that responded with content on this
  # Zen account (no payment method on file) are:
  #   hy3-free             - Tesla Hy3
  #   nemotron-3-ultra-free - NVIDIA Nemotron 3 Ultra 550B
  # All other free-tier entries 429, 401 (credits), or 500 on the supplied
  # key. The catalog changes weekly, so add new free IDs as they appear.
  ###########################################################################
  - model_name: claude-coder-zen
    litellm_params:
      model: openai/hy3-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 120
    model_info:
      provider: opencode-zen
      id: opencode-zen-hy3-free

  - model_name: claude-coder-zen
    litellm_params:
      model: openai/nemotron-3-ultra-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 120
    model_info:
      provider: opencode-zen
      id: opencode-zen-nemotron-3-ultra-free

  ###########################################################################
  # Tier 3 - OpenRouter (4 keys cycled, free models)
  # --------------------------------------------------------------------------
  # Free models have a 50-requests-per-day quota per key. With 4 keys, the
  # 4 deployments below combine to ~200/day from OpenRouter before
  # everything cools down. Verified responding with content on the supplied
  # keys (the temporarily 429 ones also recover - simple-shuffle retries them).
  ###########################################################################
  - model_name: claude-coder-openrouter
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
