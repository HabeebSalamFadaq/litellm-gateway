  ###########################################################################
  # Tier 4 - NVIDIA NIM (free frontier coding models, 1 key)
  # --------------------------------------------------------------------------
  # Verified working with the supplied key. These are NVIDIA-hosted
  # endpoints. The 1M-context models are excellent for Claude Code.
  ###########################################################################
  - model_name: claude-coder-nvidia
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      timeout: 120
    model_info:
