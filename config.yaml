router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - gateway-main: ["gateway-main-2", "gateway-backup", "gateway-legacy"]
    - gateway-main-2: ["gateway-backup", "gateway-legacy"]
    - gateway-fast: ["gateway-fast-2", "gateway-backup", "gateway-legacy"]
    - gateway-fast-2: ["gateway-backup", "gateway-legacy"]
    - gateway-backup: ["gateway-legacy"]

litellm_settings:
  drop_params: true
  # Prevent context length exceeded errors
  max_tokens: 8000
  # Enable context compression for long conversations
  context_window_fallback: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
