  ###########################################################################
  # Tier 5 - KiraAI (kiraai.vn, LAST RESORT)
  # --------------------------------------------------------------------------
  # WARNING: All models in the user-supplied list are PAID (priced in VND,
  # the response from /v1/models includes explicit VND amounts per 1M
  # tokens). They are placed LAST so the gateway only hits this tier when
  # every free tier is exhausted and cooled down.
  # Also, every model on this provider currently returns HTTP 500 from
  # the supplied key (tested at deploy time) - this tier is intentionally
  # disabled by default. To enable it, uncomment the block and set
  # KIRAAI_API_KEY.
  ###########################################################################
  # - model_name: claude-coder-kiraai
  #   litellm_params:
  #     model: openai/kira-mini-1.0
  #     api_base: https://kiraai.vn/api/v1
  #     api_key: os.environ/KIRAAI_API_KEY
  #     timeout: 120
  #   model_info:
  #     provider: kiraai
  #     id: kiraai-kira-mini-1.0
  # ... additional kiraai models omitted - see git history

###############################################################################
# Router behavior
###############################################################################
router_settings:
  # Weighted pick across all deployments under the same model_name
  routing_strategy: simple-shuffle

  # If a deployment fails this many times in the cooldown window, it is
  # taken out of the pool for cooldown_time seconds. This is the mechanism
  # that rotates an exhausted API key to the next key in the same tier.
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60

  # Per-request timeout (seconds). Lower than the per-model timeout above
  # so we get a faster failover.
  timeout: 90

  enable_pre_call_checks: false

###############################################################################
# Fallback chain across tiers
# ---------------------------------------------------------------------------
# If ALL deployments in tier 1 are in cooldown (or fail), LiteLLM moves to
# tier 2. If tier 2 is exhausted, tier 3. Then tier 4. Then tier 5.
# This satisfies the requirement: "if one provider is rate-limited, fall
# back to the next provider, do not hammer the unavailable one".
###############################################################################
litellm_settings:
  drop_params: true
  set_verbose: false

  # Generic fallbacks for any retryable error (429, 5xx, timeout, connection)
  fallbacks:
    - claude-coder: ["claude-coder-zen"]
    - claude-coder-zen: ["claude-coder-openrouter"]
    - claude-coder-openrouter: ["claude-coder-nvidia"]
    - claude-coder-nvidia: ["claude-coder-kiraai"]

  # Same again for content-policy errors
  content_policy_fallbacks:
    - claude-coder: ["claude-coder-zen"]
    - claude-coder-zen: ["claude-coder-openrouter"]
    - claude-coder-openrouter: ["claude-coder-nvidia"]
    - claude-coder-nvidia: ["claude-coder-kiraai"]

  # Same again for context-window errors
  context_window_fallbacks:
    - claude-coder: ["claude-coder-zen"]
    - claude-coder-zen: ["claude-coder-openrouter"]
    - claude-coder-openrouter: ["claude-coder-nvidia"]
    - claude-coder-nvidia: ["claude-coder-kiraai"]

  # Default fallback used when a model name is unknown
  default_fallbacks:
    - claude-coder-zen
    - claude-coder-openrouter
    - claude-coder-nvidia
    - claude-coder-kiraai

  # Each tier retries once before falling back
  num_retries: 1

###############################################################################
# Server settings
###############################################################################
general_settings:
  # Master key the gateway requires. Set via LITELLM_MASTER_KEY env var.
  # All Claude Code requests must send: Authorization: Bearer <LITELLM_MASTER_KEY>
  master_key: os.environ/LITELLM_MASTER_KEY

  # We don't use the Admin UI/database for v1 - keep things simple
  disable_spend_logs: true
  disable_error_logs: false
