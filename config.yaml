  - model_name: gateway-fast-2
    litellm_params: {model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY_1, timeout: 60}
  - model_name: gateway-fast-2
    litellm_params: {model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY_2, timeout: 60}

  # gateway-backup = proven working nemotron-3-super on OpenRouter
  - model_name: gateway-backup
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
