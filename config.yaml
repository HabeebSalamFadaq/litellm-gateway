model_list:
  ###########################################################################
  # gateway-main = SMART (all providers, all models, in priority order)
  #   Use this for reasoning, complex tasks, long context.
  #   Tries the smartest models first, falls back if any fail.
  ###########################################################################
  - model_name: gateway-main
    litellm_params: {model: nvidia_nim/moonshotai/kimi-k3, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/z-ai/glm-5.2:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/minimax/minimax-m3:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY_2, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY_3, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY_4, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/minimax/minimax-m2.7:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: openrouter/cohere/north-mini-code:free, api_key: os.environ/OPENROUTER_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_1, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_2, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_3, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_4, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_5, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_6, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_7, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_8, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_9, timeout: 60}
  - model_name: gateway-main
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY_10, timeout: 60}

  ###########################################################################
  # gateway-fast = FAST (smaller models, optimized for speed)
  #   Use this for quick tasks, code completion, short responses.
  ###########################################################################
  - model_name: gateway-fast
    litellm_params: {model: nvidia_nim/openai/gpt-oss-120b, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-fast
    litellm_params: {model: nvidia_nim/openai/gpt-oss-20b, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-fast
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-fast
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b, api_key: os.environ/NVIDIA_NIM_API_KEY, timeout: 60}
  - model_name: gateway-fast
    litellm_params: {model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY_1, timeout: 60}
  - model_name: gateway-fast
    litellm_params: {model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY_2, timeout: 60}

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60

litellm_settings:
  drop_params: true
  # Prevent context length exceeded errors
  max_tokens: 8000
  # Enable context compression for long conversations
  context_window_fallback: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
